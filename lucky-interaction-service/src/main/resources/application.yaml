server:
  port: ${INTERACTION_SERVICE_PORT:8003}

spring:
  application:
    name: lucky-interaction-service
  config:
    import:
      - "optional:nacos:common.yaml?group=${NACOS_GROUP:LUCKY_COMMUNITY}&refreshEnabled=true"
      - "optional:nacos:${spring.application.name}.yaml?group=${NACOS_GROUP:LUCKY_COMMUNITY}&refreshEnabled=true"
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        group: ${NACOS_GROUP:LUCKY_COMMUNITY}
      config:
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:LUCKY_COMMUNITY}

mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

engagement:
  reconcile:
    # 每天 04:30（上海）。按 post_id / user_id 游标分批，每批条数见 batch-size
    cron: ${ENGAGEMENT_RECONCILE_CRON:0 30 4 * * *}
    batch-size: ${ENGAGEMENT_RECONCILE_BATCH_SIZE:500}

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:lucky-interaction-producer}
    send-message-timeout: 3000
    send-message-with-vip-channel: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

spring:
  application:
    name: lucky-core-service

  # 数据源 —— 对应根目录 docker-compose.yml 启动的 MySQL(端口 3308)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3308/community?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: root
    password: root
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类包名，供 mapper.xml 里简写别名
  type-aliases-package: com.lucky.core.entity
  configuration:
    # 下划线转驼峰(user_name -> userName)
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      # 主键策略: 雪花ID
      id-type: assign_id
      # 逻辑删除字段(实体对应字段需 @TableLogic 标注)
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

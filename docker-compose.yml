# 基础设施 —— 用法:
#   docker compose up -d        # 启动
#   docker compose down         # 停止并移除容器(数据保留在 volume)
#   docker compose logs -f mysql
# 连接:
#   MySQL   host=localhost port=3308 user=root password=root database=community
#   Redis   host=localhost port=6380
#   MinIO   API http://localhost:9000  user=minioadmin password=minioadmin
#           控制台 http://localhost:9001 (用同一组账号登录)
services:
  mysql:
    image: mysql:8.0
    container_name: community-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: community
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: community-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 对象存储：头像/帖子图片等文件的上传与访问
  # 注意 MINIO_ROOT_USER/PASSWORD 必须在首次启动前定好，容器起来后再改不生效
  # (凭据存在数据卷里)，要改只能连同 minio-data 卷一起删掉重建
  minio:
    image: minio/minio:latest
    container_name: community-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      TZ: Asia/Shanghai
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"   # S3 API：应用上传/下载走这里
      - "9001:9001"   # Web 控制台：浏览器访问
    volumes:
      - minio-data:/data
    healthcheck:
      # MinIO 镜像基于 distroless，没有 curl/wget，只能用自带的 mc 探活
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  redis-data:
  minio-data:
